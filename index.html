<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="مطعم السعادة - المنيو الإلكتروني والطلبات أونلاين عبر واتساب">

    <meta name="robots" content="index, follow">

    <meta property="og:title" content="مطعم السعادة 🍔">
    <meta property="og:description"
        content="شوف المنيو واطلب أونلاين عبر واتساب">
    <meta property="og:type" content="website">

    <meta name="theme-color" content="#d63031">

    <title>مطعم السعادة 🍔 | المنيو والطلبات أونلاين</title>

    <style>
        :root {
            --primary: #d63031;
            --primary-light: #ff7675;
            --green: #25D366;
            --dark: #2d3436;
            --gray: #636e72;
            --background: #f4f6f8;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }

        body {
            background: var(--background);
            color: #333;
            padding-bottom: 80px;
        }

        /* HEADER */

        header {
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--primary-light)
            );

            color: white;
            padding: 14px 18px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;

            z-index: 1000;

            box-shadow: 0 4px 16px rgba(0,0,0,.15);
        }

        header h1 {
            font-size: 1.35rem;
        }

        .cart-button {
            border: none;
            background: white;
            color: var(--primary);

            padding: 10px 15px;
            border-radius: 25px;

            font-weight: bold;
            cursor: pointer;
        }

        .cart-badge {
            background: #00b894;
            color: white;

            border-radius: 50%;

            padding: 2px 7px;
            margin-right: 4px;
        }

        /* HERO */

        .hero {
            max-width: 1200px;
            margin: 18px auto 0;

            padding: 28px 20px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #2d3436,
                    #636e72
                );

            color: white;
        }

        .hero h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .hero p {
            line-height: 1.8;
            opacity: .9;
        }

        .hero-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;

            margin-top: 18px;
        }

        .hero-buttons button {
            border: none;

            padding: 11px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        /* CONTAINER */

        .container {
            max-width: 1200px;
            margin: 20px auto;

            padding: 0 18px;
        }

        /* SEARCH */

        .search {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 1rem;

            outline: none;

            margin-bottom: 12px;
        }

        /* CATEGORIES */

        .categories {
            display: flex;
            gap: 8px;

            overflow-x: auto;

            padding-bottom: 7px;
        }

        .category {
            background: white;

            border: 1px solid #ddd;

            padding: 9px 15px;

            border-radius: 22px;

            white-space: nowrap;

            cursor: pointer;
        }

        .category.active {
            background: var(--primary);
            color: white;

            border-color: var(--primary);
        }

        /* MEALS */

        .meals {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(220px, 1fr)
                );

            gap: 15px;

            margin-top: 18px;
        }

        .meal {
            background: white;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 4px 15px rgba(0,0,0,.07);

            transition: .2s;
        }

        .meal:hover {
            transform: translateY(-3px);
        }

        .meal img {
            width: 100%;
            height: 165px;

            object-fit: cover;

            display: block;
        }

        .meal-content {
            padding: 12px;

            text-align: center;
        }

        .meal h3 {
            margin-bottom: 6px;
        }

        .meal-description {
            color: var(--gray);

            font-size: .85rem;

            line-height: 1.6;

            min-height: 45px;
        }

        .price {
            color: #00a884;

            font-size: 1.1rem;

            font-weight: bold;

            margin: 9px;
        }

        .add-button {
            width: 100%;

            background: var(--primary);

            color: white;

            border: none;

            border-radius: 7px;

            padding: 10px;

            cursor: pointer;

            font-weight: bold;
        }

        /* MODAL */

        .modal {
            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.65);

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 2000;

            padding: 12px;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: white;

            width: 100%;

            max-width: 520px;

            max-height: 92vh;

            overflow-y: auto;

            border-radius: 15px;

            padding: 18px;
        }

        .modal-box h2 {
            margin-bottom: 12px;
        }

        /* CART */

        .cart-item {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            padding: 10px 0;

            border-bottom: 1px solid #eee;
        }

        .quantity button {
            width: 28px;
            height: 28px;

            border: none;

            background: #eee;

            border-radius: 5px;

            cursor: pointer;

            font-weight: bold;
        }

        .form-group {
            margin-top: 12px;
        }

        .form-group label {
            display: block;

            font-weight: bold;

            font-size: .9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;

            padding: 10px;

            margin-top: 5px;

            border: 1px solid #ccc;

            border-radius: 7px;
        }

        .send-order {
            width: 100%;

            background: var(--green);

            color: white;

            border: none;

            padding: 12px;

            border-radius: 8px;

            font-weight: bold;

            margin-top: 12px;

            cursor: pointer;
        }

        .close-button {
            width: 100%;

            background: #777;

            color: white;

            border: none;

            padding: 10px;

            border-radius: 8px;

            margin-top: 8px;

            cursor: pointer;
        }

        /* WHATSAPP */

        .whatsapp {
            position: fixed;

            bottom: 18px;
            right: 18px;

            background: var(--green);

            color: white;

            text-decoration: none;

            padding: 12px 16px;

            border-radius: 30px;

            font-weight: bold;

            z-index: 1500;
        }

        /* ADMIN */

        .admin-button {
            position: fixed;

            bottom: 18px;
            left: 18px;

            width: 48px;
            height: 48px;

            border: none;

            border-radius: 50%;

            background: var(--dark);

            color: white;

            font-size: 20px;

            cursor: pointer;

            z-index: 1500;
        }

        .admin-stat {
            background: #f7f7f7;

            padding: 12px;

            border-radius: 9px;

            margin-bottom: 10px;
        }

        /* MOBILE */

        @media(max-width:600px) {

            header h1 {
                font-size: 1.05rem;
            }

            .hero h2 {
                font-size: 1.55rem;
            }

            .meals {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 10px;
            }

            .meal img {
                height: 125px;
            }

            .meal-content {
                padding: 9px;
            }

            .meal-description {
                font-size: .78rem;
            }

            .add-button {
                font-size: .85rem;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>مطعم السعادة 🍔</h1>

    <button
        class="cart-button"
        onclick="openCart()">

        السلة 🛒

        <span
            class="cart-badge"
            id="cartCount">

            0

        </span>

    </button>

</header>


<section class="hero">

    <h2>
        أهلاً بيك في مطعم السعادة ❤️
    </h2>

    <p>
        اختار أكلك، ضيفه للسلة،
        وابعت الطلب مباشرة على واتساب.
    </p>

    <div class="hero-buttons">

        <button
            onclick="document.getElementById('search').focus()">

            🔎 ابحث في المنيو

        </button>

        <button onclick="shareWebsite()">

            📤 مشاركة الموقع

        </button>

    </div>

</section>


<main class="container">

    <input
        id="search"
        class="search"
        type="search"
        placeholder="ابحث عن برجر، بيتزا، كريب..."
        oninput="filterMeals()">


    <div
        id="categories"
        class="categories">
    </div>


    <div
        id="meals"
        class="meals">
    </div>

</main>


<a
    class="whatsapp"
    target="_blank"
    href="https://wa.me/201095075717">

    💬 واتساب

</a>


<button
    class="admin-button"
    onclick="adminLogin()">

    ⚙️

</button>


<!-- CART -->

<div
    id="cartModal"
    class="modal">

    <div class="modal-box">

        <h2>
            سلة الطلب 🛒
        </h2>

        <div id="cartItems"></div>

        <h3 style="margin-top:15px">

            الإجمالي:

            <span
                id="cartTotal"
                style="color:#00a884">

                0

            </span>

            ج.م

        </h3>


        <div class="form-group">

            <label>
                الاسم *
            </label>

            <input
                id="customerName"
                autocomplete="name"
                placeholder="اكتب اسمك">

        </div>


        <div class="form-group">

            <label>
                العنوان *
            </label>

            <input
                id="customerAddress"
                autocomplete="street-address"
                placeholder="الشارع / رقم العمارة / الشقة">

        </div>


        <div class="form-group">

            <label>
                ملاحظات
            </label>

            <textarea
                id="customerNotes"
                rows="3"
                placeholder="مثلاً: بدون بصل">

            </textarea>

        </div>


        <button
            class="send-order"
            onclick="sendOrder()">

            إرسال الطلب على واتساب 💬

        </button>


        <button
            class="close-button"
            onclick="closeModal('cartModal')">

            إغلاق

        </button>

    </div>

</div>


<!-- DETAILS -->

<div
    id="detailsModal"
    class="modal">

    <div
        class="modal-box"
        id="detailsContent">
    </div>

</div>


<!-- ADMIN -->

<div
    id="adminModal"
    class="modal">

    <div class="modal-box">

        <h2>
            لوحة الإدارة 📊
        </h2>

        <div id="adminContent"></div>

        <button
            class="close-button"
            onclick="closeModal('adminModal')">

            إغلاق

        </button>

    </div>

</div>


<footer
    style="
    text-align:center;
    color:#777;
    padding:25px 10px;
    ">

    © 2026 مطعم السعادة
    — جميع الحقوق محفوظة

</footer>
